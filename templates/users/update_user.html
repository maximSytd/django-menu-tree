{% extends 'base.html' %}
{% load i18n %}
{% load static %}

{% block title %}{% trans "Update info" %}{% endblock %}

{% block style %}
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'invoices/css/create_invoice.css' %}" />
{% endblock %}

{% block page_name %}
<div class="w-100 d-flex justify-content-center">
    <a class="navbar-brand mx-auto" href="#">{% trans "Update info" %}</a>
</div>
{% endblock %}

{% block content %}
    <div class="content-container p-3">
        <form method="post" >
            {% csrf_token %}
            {{ form }}
            <button class="btn btn-primary" type="submit">{% trans "Done" %}</button>
        </form>
    </div>
{% endblock %}
